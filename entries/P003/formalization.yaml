    "name": "An exact counterexample to the D-unstable-core conjecture for parameter-rich reaction networks",
    "description": "A consistent reaction network with four species and five reactions has an admissible parameter-rich Jacobian with an eigenvalue of strictly positive real part, yet has no D-unstable child-selection core. Consistency is expressed by a strictly positive stoichiometric kernel flux, and admissible reactivities are positive exactly on reactant incidences. The formal theorem refutes the corresponding universal necessity assertion for D-unstable cores.",
