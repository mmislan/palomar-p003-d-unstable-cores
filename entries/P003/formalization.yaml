    "name": "An exact counterexample to the D-unstable-core conjecture for parameter-rich reaction networks",
    "description": "Vassena and Stadler conjectured that a reaction network with parameter-rich kinetics cannot have a Hurwitz-unstable Jacobian unless it contains a D-unstable core, a minimal square child-selection submatrix that becomes unstable under positive column scaling. We show that this conjecture is false. We construct a consistent reaction network with four species and five reactions and an admissible reactivity matrix for which the Jacobian has an eigenvalue with strictly positive real part, yet the network has no D-unstable core. Consistency is witnessed by a strictly positive stoichiometric kernel flux, and reactivities are positive exactly on reactant incidences. The counterexample and the resulting negation of the universal necessity statement are proved in Lean 4 with Mathlib.",
